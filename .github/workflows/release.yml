name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # An empty or non-https address would ship an app that cannot sign in (or points at localhost).
      - name: Check company backend address
        shell: pwsh
        env:
          COMPANY_BACKEND_URL: ${{ vars.COMPANY_BACKEND_URL }}
        run: |
          if ($env:COMPANY_BACKEND_URL -notmatch '^https://\S+$') {
            Write-Error "Repository variable COMPANY_BACKEND_URL must be set to the company API address starting with https://"
            exit 1
          }

      # Self-contained: bundles the .NET runtime, so nothing needs to be installed on the PC
      - name: Publish (win-x64, self-contained, compressed, single file)
        run: >
          dotnet publish SqlStudio.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -p:CompanyBackendUrl=${{ vars.COMPANY_BACKEND_URL }}
          -o publish

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\SqlStudio.iss

      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath SqlStudio-win-x64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SqlStudio-win-x64
          path: |
            installer-out/*.exe
            SqlStudio-win-x64-portable.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer-out/*.exe
            SqlStudio-win-x64-portable.zip
          generate_release_notes: true
